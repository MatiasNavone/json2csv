[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "json2csv"
dynamic = ["version"]
description = "Conversor de JSON a CSV con estrategia de filtro"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Matias Valentin Navone"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = []
requires-python = ">= 3.12"

[project.scripts]
json2csv = "json2csv.json2csv:main"

[tool.hatch.version]
source = "regex"
path = "VERSION"
pattern = "(?P<version>\\d+\\.\\d+\\.\\d+)"

[tool.hatch.build.targets.wheel]
packages = ["src/json2csv"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]

[tool.mypy]
files = ["src"]
strict = true

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=json2csv --cov-branch --cov-report=term-missing --cov-fail-under=85"
