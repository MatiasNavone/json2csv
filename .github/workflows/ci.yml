name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    name: Calidad y tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Crear ambiente virtual (venv) e instalar dependencias
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt
      - name: Ruff (lint)
        run: . .venv/bin/activate && ruff check .
      - name: Black (formato)
        run: . .venv/bin/activate && black --check src tests
      - name: PEP8 (pycodestyle)
        run: . .venv/bin/activate && pycodestyle --max-line-length=88 src tests
      - name: PEP257 (pydocstyle)
        run: . .venv/bin/activate && pydocstyle --convention=pep257 src
      - name: MyPy
        run: . .venv/bin/activate && mypy
      - name: PyRight
        run: . .venv/bin/activate && pyright
      - name: Bandit (seguridad básica)
        run: . .venv/bin/activate && bandit -q -r src
      - name: Pytest (cobertura mínima 85 %)
        run: . .venv/bin/activate && pytest

  docs:
    name: Documentación (pdoc)
    needs: calidad
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar documentación con pdoc
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt
          PYTHONPATH=src pdoc json2csv -o docs/api
      - uses: actions/upload-artifact@v4
        with:
          name: documentacion
          path: docs/api
      - name: Preparar GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api
      - name: Publicar en GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/deploy-pages@v4

  build:
    name: Build y release (CD)
    needs: calidad
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Registrar BUILD y construir paquete
        run: |
          echo "${{ github.run_number }}" > BUILD
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Crear release (solo con tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
